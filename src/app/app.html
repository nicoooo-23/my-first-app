<main class="resume">
  <header class="intro">
    <h1>{{ fullName }}</h1>
    <p>
      {{ location }} |
      {{ phone }} |
      <a [href]="'mailto:' + email">{{ email }}</a>
    </p>
  </header>

  <section>
    <h2>Personal Profile</h2>
    <p>{{ profile }}</p>
  </section>

  <app-profile-card></app-profile-card>

  <section>
    <h2>Key Skills</h2>
    <ul>
      @for (skill of skills; track skill) {
        <li>{{ skill }}</li>
      }
    </ul>
  </section>

  <section class="interaction">
    <h2>Angular Interaction</h2>
    <p>{{ message }}</p>
    <button (click)="showMessage()">Click Me</button>
  </section>
</main>
